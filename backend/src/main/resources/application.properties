spring.application.name=OPD
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/opd}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:YourPassword}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update

jwt.secret=${JWT_SECRET:YourJwtSecretKeyMin32Keyword}
jwt.expiration=${JWT_EXPIRATION:86400000}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:YourEmailAddress}
spring.mail.password=${MAIL_PASSWORD:GmailAppPasswordWithGivenEmail}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.frontend.url=${FRONTEND_URL:http://localhost:5173}